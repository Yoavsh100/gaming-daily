# Builds the Iceman edition every weekday and publishes it to GitHub Pages
# (served from the gh-pages branch):
#   https://yoavsh100.github.io/gaming-daily/YYYY-MM-DD/   one permanent page per edition
#   https://yoavsh100.github.io/gaming-daily/              always the latest edition
# Results stories it spots are queued in reports/candidates.json for the Merlin job.
name: Iceman daily

on:
  schedule:
    # Three EARLY attempts so the edition is built before the 08:30 Cyprus (05:30 UTC EEST /
    # 06:30 UTC EET) send, even if GitHub drops or delays a tick. Redundant runs are harmless:
    # the concurrency group serialises them and the publish step is a no-op when nothing changed.
    # NOTE: GitHub's `schedule` is best-effort — it still sometimes runs hours late. For a hard
    # deadline, an external workflow_dispatch trigger is the only reliable mechanism (see README/skill).
    - cron: '42 2 * * 1-5' # ~02:42 UTC
    - cron: '23 3 * * 1-5' # ~03:23 UTC
    - cron: '11 4 * * 1-5' # ~04:11 UTC
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['src/**', '.github/workflows/daily.yml']

permissions:
  contents: write

concurrency:
  group: gaming-daily
  cancel-in-progress: false

jobs:
  edition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check out the published site
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch origin gh-pages
            git worktree add site gh-pages
          else
            git worktree add --orphan -b gh-pages site
          fi

      - name: Build edition
        run: node src/digest.js
        env:
          GAMING_DAILY_API_KEY: ${{ secrets.GAMING_DAILY_API_KEY }}
          ICEMAN_SITE: site

      - name: Publish to gh-pages
        run: |
          DAY=$(date -u +%F)
          mkdir -p "site/$DAY"
          cp "out/gaming-daily-$DAY.html" "site/$DAY/index.html"
          cp "out/gaming-daily-$DAY.html" site/index.html
          touch site/.nojekyll
          printf 'User-agent: *\nDisallow: /\n' > site/robots.txt
          cd site
          git add -A
          git -c user.name="gaming-daily-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Edition $DAY" || { echo "No changes"; exit 0; }
          git push origin gh-pages
